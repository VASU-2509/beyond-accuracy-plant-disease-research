[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "plant-disease-research"
version = "0.1.0"
requires-python = ">=3.11"
description = "Reproducible plant disease domain-shift and calibration study"

[tool.setuptools.packages.find]
include = ["research*", "backend*"]

[tool.pytest.ini_options]
testpaths = ["research/tests", "backend/tests"]
pythonpath = ["."]
